[package]
name = "siege"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

# build.sh runs wasm-opt itself with the right feature flags; wasm-pack's
# internal pass rejects bulk-memory ops that modern rustc emits by default.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "ImageData",
  "Storage",
  "AudioContext",
  "AudioContextState",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "AudioBuffer",
  "AudioBufferSourceNode",
  "OscillatorNode",
  "OscillatorType",
  "GainNode",
  "BiquadFilterNode",
  "BiquadFilterType",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
